# AeroFlow Studio - project metadata and tool configuration.
# The app is run from source (main.py) or installed with the Windows installer (packaging/); dependencies
# are pinned in requirements.txt / requirements-gpu.txt, which setup_windows.bat installs.

[project]
name = "aeroflow-studio"
dynamic = ["version"]
description = "Desktop aerodynamics studio: instant 3-D CFD, OpenFOAM, polars, a real-time 2-D flow lab and a supersonic lab"
readme = "README.md"
requires-python = ">=3.10,<3.15"

[project.urls]
Homepage = "https://github.com/albertmanoiu29-cell/aeroflow"
Releases = "https://github.com/albertmanoiu29-cell/aeroflow/releases"
Issues = "https://github.com/albertmanoiu29-cell/aeroflow/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["dist", "build", "packaging/redist"]

[tool.ruff.lint]
# Pyflakes (real errors: undefined names, unused imports) + flake8-bugbear (likely bugs).
select = ["F", "B", "E9"]
# zip(strict=...) everywhere would be churn: the zipped arrays are built with equal lengths.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
