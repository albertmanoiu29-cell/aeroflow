name: Release

# Push a tag like v1.5.0 (matching APP_VERSION in config/settings.py) to build the Windows installer and the
# launcher and attach them to the GitHub release of that tag (created if it does not exist yet).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches APP_VERSION
        shell: pwsh
        run: |
          $m = Select-String -Path config/settings.py -Pattern 'APP_VERSION: Final\[str\] = "([0-9.]+)"'
          $version = $m.Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match APP_VERSION $version in config/settings.py"
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build launcher and installer
        shell: pwsh
        run: |
          ./packaging/build_release.ps1
          Copy-Item "dist/AeroFlow Studio.exe" "dist/AeroFlow.Studio.exe"

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($v))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $v" }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern "^## \[" | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $intro = "Download **AeroFlowStudio-Setup-$v.exe** below and run it (Windows 10/11, 64-bit; no admin rights needed)."
          ($intro, "", $body) | Set-Content -Encoding utf8 release_notes.md

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: AeroFlow Studio ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/AeroFlowStudio-Setup-*.exe
            dist/AeroFlow.Studio.exe
